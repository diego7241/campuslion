spring.profiles.active=test

spring.web.error.include-stacktrace=never

# The H2 web console gives direct database access: keep it off (DevTools would enable it otherwise)
spring.h2.console.enabled=false

# JPA: keep the persistence context scoped to the service layer (transactions)
# instead of the whole web request
spring.jpa.open-in-view=false
# Load lazy lesson collections in batches (IN queries) instead of one query per course
spring.jpa.properties.hibernate.default_batch_fetch_size=100

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=true